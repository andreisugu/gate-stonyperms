<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StonyPermsWeb</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="navbar">
    <div class="nav-left">
      <a href="#/" class="brand" id="nav-brand">
        <img src="./favicon.svg" alt="StonyPerms" class="brand-logo">
        <span class="brand-name">StonyPerms</span>
      </a>
      <span class="nav-divider"></span>
      <span class="nav-tagline">Gate Proxy &amp; Cross-Server Permissions</span>
      <span id="session-mode-pill" class="mode-pill hidden"></span>
    </div>

    <div class="nav-right">
      <button type="button" class="search-trigger" id="btn-global-search" title="Search (Ctrl+K)">
        <span class="icon">⌕</span>
        <span class="search-label">SEARCH</span>
        <span class="kbd-group"><kbd>Ctrl</kbd><kbd>K</kbd></span>
      </button>

      <button type="button" class="nav-link" id="nav-download">
        <span class="nav-ico">⬇</span> DOWNLOAD
      </button>
      <a href="#/wiki" class="nav-link" data-route="/wiki">
        <span class="nav-ico">▤</span> WIKI
      </a>

      <div class="dropdown" id="tools-dropdown">
        <button type="button" class="nav-link dropdown-toggle" id="btn-tools-menu" aria-expanded="false">
          <span class="nav-ico">⚒</span> TOOLS <span class="caret">▾</span>
        </button>
        <div class="dropdown-menu" id="tools-menu">
          <a href="#/editor" class="dropdown-item" data-route="/editor">
            <strong>Web Editor</strong>
            <span>Manage groups, users, tracks &amp; nodes</span>
          </a>
          <a href="#/verbose" class="dropdown-item" data-route="/verbose">
            <strong>Verbose Viewer</strong>
            <span>Inspect recorded permission checks</span>
          </a>
          <a href="#/tree" class="dropdown-item" data-route="/tree">
            <strong>Permission Tree</strong>
            <span>Browse registered node hierarchy</span>
          </a>
          <div class="dropdown-sep"></div>
          <button type="button" class="dropdown-item" id="btn-nav-demo-editor">
            <strong>Open Demo Editor</strong>
            <span>Try StonyPermsWeb with sample data</span>
          </button>
        </div>
      </div>

      <a href="https://github.com/andreisugu/gate-stonyperms" target="_blank" rel="noopener noreferrer" class="nav-icon-btn" title="GitHub Repository">
        <svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor" aria-hidden="true">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
        </svg>
      </a>
    </div>
  </header>

  <main id="app" class="app-root"></main>

  <footer class="footer">
    <div class="footer-left">
      <span class="git-tag">⎇ StonyPermsWeb</span> <span class="accent">@ v0.3.0</span>
    </div>
    <div class="footer-right">
      <a href="#/wiki/http-api">HTTP API</a> ·
      <a href="https://github.com/andreisugu/gate-stonyperms" target="_blank" rel="noopener noreferrer">gate-stonyperms</a> ·
      <a href="https://github.com/andreisugu/stonyperms-bridge" target="_blank" rel="noopener noreferrer">stonyperms-bridge</a> ·
      <span>ChaoniusMC</span>
    </div>
  </footer>

  <div id="modal-root" class="modal-backdrop hidden" role="dialog" aria-modal="true"></div>
  <div id="toast-root" class="toast-container"></div>

  <script src="./demo-data.js"></script>
  <script src="./wiki-data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
